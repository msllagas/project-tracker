server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Laravel API and Sanctum's CSRF cookie route, executed by PHP-FPM in the backend container.
    location ~ ^/(api|sanctum)/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_pass backend:9000;
    }

    # Fingerprinted build assets never change, so let browsers cache them.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Every other path belongs to the Vue router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
